name: Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, for example v1.0.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release version
        id: release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::releases must be dispatched from $DEFAULT_BRANCH, got $REF_NAME"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must match vMAJOR.MINOR.PATCH, for example v1.0.3"
            exit 1
          fi

          git fetch --tags --force origin

          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "::error::release tag $VERSION already exists"
            exit 1
          fi

          major_number="${VERSION#v}"
          major="v${major_number%%.*}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push release tags
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MAJOR: ${{ steps.release.outputs.major }}
        run: |
          set -euo pipefail

          git tag -a "$VERSION" -m "Merge Warden $VERSION"
          git push origin "refs/tags/$VERSION"

          git tag -f "$MAJOR" "$VERSION"
          git push origin "refs/tags/$MAJOR" --force
