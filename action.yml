name: Merge Warden
description: >
  Adversarial AI review of a pull request. Posts APPROVE, COMMENT, or
  REQUEST CHANGES with inline comments on the diff. Run after CI, PR-only.
author: Leonardo Araujo

branding:
  icon: lock
  color: purple

inputs:
  github-token:
    description: Token with contents read, issues read, and pull-requests write.
    required: false
    default: ${{ github.token }}
  xai-api-key:
    description: xAI API key (https://console.x.ai/).
    required: true
  pr-number:
    description: Pull request number to review.
    required: true
  prompt-file:
    description: >
      Path to a markdown system prompt in the caller repository. Leave empty
      to use Merge Warden's built-in adversarial review prompt.
    required: false
    default: ""
  model:
    description: Grok model name.
    required: false
    default: grok-4.6
  arch-docs:
    description: >
      Newline- or comma-separated paths (on the checked-out default branch)
      to inject after the system prompt. If empty, common files such as
      README.md, CONTRIBUTING.md, and AGENTS.md are included when present.
    required: false
    default: ""
  skip-names:
    description: >
      Extra basenames to skip when attaching changed-file contents
      (newline- or comma-separated).
    required: false
    default: ""
  head-ref:
    description: Local git ref name for the fetched PR head.
    required: false
    default: pr-head
  fetch-head:
    description: Fetch pull/{n}/head into head-ref before reviewing.
    required: false
    default: "true"
  post:
    description: Post the GitHub review and inline comments after generating it.
    required: false
    default: "true"

outputs:
  markdown-path:
    description: Path to the written review markdown.
    value: ${{ steps.review.outputs.markdown-path }}
  json-path:
    description: Path to the GitHub review JSON payload.
    value: ${{ steps.review.outputs.json-path }}
  comment-count:
    description: Number of inline comments in the payload.
    value: ${{ steps.review.outputs.comment-count }}
  event:
    description: GitHub review event (APPROVE, COMMENT, or REQUEST_CHANGES).
    value: ${{ steps.review.outputs.event }}

runs:
  using: composite
  steps:
    - name: Fetch PR head (read-only)
      if: ${{ inputs.fetch-head == 'true' }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_REF: ${{ inputs.head-ref }}
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=1 origin "pull/${PR_NUMBER}/head:${HEAD_REF}"

    - name: Run Merge Warden
      id: review
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        XAI_API_KEY: ${{ inputs.xai-api-key }}
        XAI_MODEL: ${{ inputs.model }}
        ARCH_DOCS: ${{ inputs.arch-docs }}
        SKIP_NAMES: ${{ inputs.skip-names }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_REF: ${{ inputs.head-ref }}
        POST: ${{ inputs.post }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
        ACTION_PATH: ${{ github.action_path }}
      shell: bash
      run: |
        set -euo pipefail
        prompt="${PROMPT_FILE:-}"
        if [ -z "$prompt" ]; then
          prompt="${ACTION_PATH}/prompt.md"
        fi
        extra=()
        if [ "${POST}" = "true" ]; then
          extra+=(--post)
        fi
        python3 "${ACTION_PATH}/merge_warden.py" \
          --pr "${PR_NUMBER}" \
          --prompt-file "${prompt}" \
          --output merge-warden.md \
          --json-output merge-warden.json \
          --head-ref "${HEAD_REF}" \
          "${extra[@]}"
