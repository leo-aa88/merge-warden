name: Merge Warden
description: >
  Adversarial AI review of a pull request. Posts APPROVE, COMMENT, or
  REQUEST CHANGES with inline comments on the diff. Run after CI, PR-only.
author: Leonardo Araujo

branding:
  icon: lock
  color: purple

inputs:
  github-token:
    description: Token with contents read, issues read, and pull-requests write.
    required: false
    default: ${{ github.token }}
  provider:
    description: >
      LLM provider: xai (grok), openai (chatgpt), anthropic (claude),
      or google (gemini).
    required: false
    default: xai
  xai-api-key:
    description: xAI API key (https://console.x.ai/). Required when provider is xai.
    required: false
    default: ""
  openai-api-key:
    description: OpenAI API key (https://platform.openai.com/). Required when provider is openai.
    required: false
    default: ""
  anthropic-api-key:
    description: Anthropic API key (https://console.anthropic.com/). Required when provider is anthropic.
    required: false
    default: ""
  google-api-key:
    description: >
      Google AI Studio / Gemini API key (https://aistudio.google.com/).
      Required when provider is google. GEMINI_API_KEY is also accepted.
    required: false
    default: ""
  pr-number:
    description: Pull request number to review.
    required: true
  prompt-file:
    description: >
      Path to a markdown system prompt in the caller repository. Leave empty
      to use Merge Warden's built-in adversarial review prompt.
    required: false
    default: ""
  model:
    description: >
      Model name. Empty uses the provider default (grok-4.6, gpt-4.1,
      claude-sonnet-4-6, or gemini-2.5-pro).
    required: false
    default: ""
  arch-docs:
    description: >
      Newline- or comma-separated paths (on the checked-out default branch)
      to inject after the system prompt. If empty, common files such as
      README.md, CONTRIBUTING.md, and AGENTS.md are included when present.
    required: false
    default: ""
  skip-names:
    description: >
      Extra basenames to skip when attaching changed-file contents
      (newline- or comma-separated).
    required: false
    default: ""
  head-ref:
    description: Local git ref name for the fetched PR head.
    required: false
    default: pr-head
  fetch-head:
    description: Fetch pull/{n}/head into head-ref before reviewing.
    required: false
    default: "true"
  post:
    description: Post the GitHub review and inline comments after generating it.
    required: false
    default: "true"
  skip-if-missing-key:
    description: >
      If true, skip the review when the provider API key is unset instead of
      failing the job.
    required: false
    default: "false"

outputs:
  markdown-path:
    description: Path to the written review markdown.
    value: ${{ steps.review.outputs.markdown-path }}
  json-path:
    description: Path to the GitHub review JSON payload.
    value: ${{ steps.review.outputs.json-path }}
  generated-event:
    description: Review event produced by the model (APPROVE, COMMENT, or REQUEST_CHANGES).
    value: ${{ steps.review.outputs.generated-event }}
  generated-comment-count:
    description: Inline comments in the generated payload, before GitHub accepts the review.
    value: ${{ steps.review.outputs.generated-comment-count }}
  posted-event:
    description: Review event GitHub actually accepted. Empty when post is false.
    value: ${{ steps.review.outputs.posted-event }}
  posted-comment-count:
    description: Inline comments GitHub actually accepted. Empty when post is false.
    value: ${{ steps.review.outputs.posted-comment-count }}
  comment-count:
    description: Posted inline comment count when posting, otherwise the generated count.
    value: ${{ steps.review.outputs.comment-count }}
  event:
    description: Posted review event when posting, otherwise the generated event.
    value: ${{ steps.review.outputs.event }}

runs:
  using: composite
  steps:
    - name: Fetch PR head (read-only)
      if: ${{ inputs.fetch-head == 'true' }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_REF: ${{ inputs.head-ref }}
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=1 origin "pull/${PR_NUMBER}/head:${HEAD_REF}"

    - name: Run Merge Warden
      id: review
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        MERGE_WARDEN_PROVIDER: ${{ inputs.provider }}
        MERGE_WARDEN_MODEL: ${{ inputs.model }}
        XAI_API_KEY: ${{ inputs.xai-api-key }}
        XAI_MODEL: ${{ inputs.model }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GOOGLE_API_KEY: ${{ inputs.google-api-key }}
        ARCH_DOCS: ${{ inputs.arch-docs }}
        SKIP_NAMES: ${{ inputs.skip-names }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_REF: ${{ inputs.head-ref }}
        POST: ${{ inputs.post }}
        SKIP_IF_MISSING_KEY: ${{ inputs.skip-if-missing-key }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
        ACTION_PATH: ${{ github.action_path }}
      shell: bash
      run: |
        set -euo pipefail
        prompt="${PROMPT_FILE:-}"
        if [ -z "$prompt" ]; then
          prompt="${ACTION_PATH}/prompt.md"
        fi
        extra=()
        if [ "${POST}" = "true" ]; then
          extra+=(--post)
        fi
        if [ "${SKIP_IF_MISSING_KEY}" = "true" ]; then
          extra+=(--skip-if-missing-key)
        fi
        python3 "${ACTION_PATH}/merge_warden.py" \
          --pr "${PR_NUMBER}" \
          --provider "${MERGE_WARDEN_PROVIDER:-xai}" \
          --model "${MERGE_WARDEN_MODEL:-}" \
          --prompt-file "${prompt}" \
          --output merge-warden.md \
          --json-output merge-warden.json \
          --head-ref "${HEAD_REF}" \
          "${extra[@]}"
